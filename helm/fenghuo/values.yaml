# Fenghuo（烽火台）Helm chart 默认配置
# 所有应用配置均通过 FENGHUO_* 环境变量注入

image:
  repository: fenghuo
  tag: latest
  pullPolicy: IfNotPresent

# 私有镜像仓库拉取凭证；Secret 须与应用部署在同一 namespace
imagePullSecrets: []
#  - name: harbor-pull-secret

replicaCount: 1

# 外部访问地址（FR-6），反向代理/子路径部署时改成实际地址
rootUrl: "http://localhost:8080/"

# 外部 PostgreSQL（chart 不内置数据库）
# 密码不在此处配置，统一由下方 secrets.existingSecret 指向的 Secret 提供
database:
  host: ""                   # 必填：外部 PostgreSQL 地址，留空时安装直接报错
  port: 5432
  user: ""
  dbname: ""
  sslmode: disable

# 密钥管理：所有敏感信息只通过外部 Secret 提供，不经过 values
# existingSecret 指向预先创建好的 Secret，须包含以下 key：
#   - jwt-secret        （必需）
#   - database-password （必需）
#   - feishu-app-secret （仅 oauth.enabled=true 时必需）
# 创建示例见 README.md「密钥管理」一节
secrets:
  existingSecret: ""         # 必填：Secret 名称，留空时安装直接报错

# 飞书 OAuth 登录
oauth:
  enabled: false
  feishuAppId: ""            # 飞书开放平台应用的 App ID（cli_ 开头）
  # 留空表示不限制邮箱；配置多个邮箱时逐项填写
  allowedEmails: []
  # 首次通过飞书登录时自动创建本地用户
  autoCreateUser: true

# 容器时区（TZ 环境变量）；影响告警模板时间渲染与「今日/本周」统计的自然日边界
timezone: Asia/Shanghai

logLevel: info

alert:
  dedupWindow: 5m
  retentionDays: 30

channel:
  httpTimeout: 10s
  retryMax: 2

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: higress
  host: fenghuo.local
  path: /
  pathType: Prefix
  # rootUrl 的 scheme、host 和 path 必须与外部访问地址一致

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 256Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
