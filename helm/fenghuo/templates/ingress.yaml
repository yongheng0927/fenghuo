{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "fenghuo.fullname" . }}
  labels:
    {{- include "fenghuo.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    # host 留空时匹配任意 Host 头，用于直接以 IP 访问（k8s 不允许 host 填 IP）
    - {{- with .Values.ingress.host }}
      host: {{ . }}
      {{- end }}
      http:
        paths:
          - path: {{ .Values.ingress.path | quote }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "fenghuo.fullname" . }}
                port:
                  name: http
{{- end }}
